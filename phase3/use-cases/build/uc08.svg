" y="601.52" fill="#000" font-size="12" textLength="223.202">Система показывает ошибку весов</text><ellipse cx="488.004" cy="653.7" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="488.004" cy="653.7" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="438.504,530.02,537.503,530.02,549.503,542.02,537.503,554.02,438.504,554.02,426.504,542.02,438.504,530.02" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="492.004" y="565.24" fill="#000" font-size="11" textLength="19.8">нет</text><text x="438.504" y="545.98" fill="#000" font-size="11" textLength="98.999">Все веса верны?</text><rect x="326.802" y="716.78" width="322.403" height="35.84" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="336.802" y="739.02" fill="#000" font-size="12" textLength="302.403">Система рассчитывает пропорциональные доли</text><rect x="344.802" y="772.62" width="286.402" height="51.68" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="354.802" y="794.86" fill="#000" font-size="12" textLength="259.202">Остаток распределяется по наибольшим</text><text x="354.802" y="810.7" fill="#000" font-size="12" textLength="266.402">дробным частям, при равенстве — по ID</text><rect x="659.205" y="459.18" width="286.402" height="35.84" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="669.205" y="481.42" fill="#000" font-size="12" textLength="266.402">Участник вводит неотрицательные суммы</text><rect x="684.405" y="584.32" width="236.002" height="35.84" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="694.405" y="606.56" fill="#000" font-size="12" textLength="216.002">Система показывает расхождение</text><ellipse cx="802.406" cy="658.74" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="802.406" cy="658.74" rx="6" ry="6" fill="